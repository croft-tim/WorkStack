<svg width="100%" viewBox="0 0 680 105" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      /* Colour tokens */
      :root {
        --bar1: #334155;
        --bar2: #475569;
        --bar3: #64748B;
        --text: #1E293B;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bar1: #94A3B8;
          --bar2: #CBD5E1;
          --bar3: #E2E8F0;
          --text: #F1F5F9;
        }
      }

      @keyframes f1 { 0%, 33%, 100% { fill: var(--bar1); } 5%, 28% { fill: #F59E0B; } }
      @keyframes f2 { 0%, 33%, 100% { fill: var(--bar2); } 5%, 28% { fill: #F59E0B; } }
      @keyframes f3 { 0%, 33%, 100% { fill: var(--bar3); } 5%, 28% { fill: #F59E0B; } }

      .b1 { fill: var(--bar1); animation: f1 5s linear infinite; }
      .b2 { fill: var(--bar2); animation: f2 5s -3.33s linear infinite; }
      .b3 { fill: var(--bar3); animation: f3 5s -1.67s linear infinite; }
      .logo-text { fill: var(--text); }
    </style>
  </defs>

  <rect class="b1" x="40" y="38" width="78" height="10" rx="2"/>
  <rect class="b2" x="52" y="51" width="78" height="10" rx="2"/>
  <rect class="b3" x="64" y="64" width="78" height="10" rx="2"/>

  <text class="logo-text" x="146" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="50">
    <tspan font-weight="400">Work</tspan><tspan font-weight="500">Stack</tspan>
  </text>
</svg>
